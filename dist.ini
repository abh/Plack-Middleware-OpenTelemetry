name             = Plack-Middleware-OpenTelemetry
author           = Ask Bjoern Hansen
license          = MIT
copyright_holder = Ask Bjoern Hansen

[@Filter]
bundle = @Basic
remove = Readme

[AutoVersion]
major = 0

[PkgVersion]
[PodVersion]

[PruneFiles]
filename = CLAUDE.md
match    = ^\.

[Prereqs]
Plack              = 1.0050
parent             = 0.223
OpenTelemetry      = 0.018
OpenTelemetry::SDK = 0.020
Feature::Compat::Try = 0

[NextRelease]
format = %v -- %{EEE MMM dd HH:mm:ss VVV yyyy}d

[MetaJSON]
[MetaResources]
repository.url    = git://github.com/abh/Plack-Middleware-OpenTelemetry.git
repository.type   = git


[Signature]

[@Git]

[Bugtracker]
web = http://github.com/abh/Plack-Middleware-OpenTelemetry/issues
